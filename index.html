<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>EYELIVE TESTE</title></head>
<body style="background:#000;color:#fff;font-family:monospace;text-align:center;padding:50px">
    <h1>EYELIVE TESTE</h1>
    <input type="text" id="url" placeholder="URL do Ngrok: https://xxx.ngrok-free.app" style="padding:15px;width:80%;font-size:16px">
    <br><br>
    <button onclick="ping()" style="padding:20px;font-size:20px;background:#ffd700;color:#000;font-weight:bold;width:80%">🔍 PINGAR</button>
    <div id="r" style="margin-top:30px;font-size:18px"></div>
<script>
async function ping(){
    var url=document.getElementById('url').value.trim();
    if(!url.startsWith('http'))url='https://'+url;
    document.getElementById('r').textContent='Pingando '+url+'...';
    try{
        var resp=await fetch(url+'/ping');
        var text=await resp.text();
        document.getElementById('r').innerHTML='<h2 style=color:#0f0>'+text+'</h2>';
    }catch(e){
        document.getElementById('r').innerHTML='<h2 style=color:red>ERRO: '+e.message+'</h2>';
    }
}
</script>
</body>
</html>
