<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700}
        .container{max-width:450px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:100px;font-size:.85em;color:#aaa;white-space:pre-wrap}
        .status{color:#00ff88}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card">
        <h2 style="color:#ffd700;margin-bottom:15px">🔗 Conectar ao Dispositivo</h2>
        <p style="color:#888;font-size:.8em;margin-bottom:10px">Cole a URL do Ngrok ou IP:porta do celular</p>
        <input type="text" id="url" placeholder="https://xxx.ngrok-free.app ou 192.168.1.5:5050" autofocus>
        <button class="btn btn-gold" onclick="conectar()">🔗 Conectar</button>
        <button class="btn btn-green" onclick="cmd('status')" id="btnStatus" style="display:none">📊 Status</button>
        <button class="btn btn-gold" onclick="cmd('foto')" id="btnFoto" style="display:none">📸 Tirar Foto</button>
    </div>
    <div class="result" id="result">👆 Cole a URL do dispositivo e clique Conectar</div>
</div>
<script>
var BASE_URL = '';

function conectar(){
    var url = document.getElementById('url').value.trim();
    if(!url) return alert('Cole a URL!');
    if(!url.startsWith('http')) url = 'http://' + url;
    BASE_URL = url;
    
    fetch(BASE_URL + '/')
    .then(r => r.json())
    .then(d => {
        document.getElementById('result').innerHTML = '<p class="status">✅ CONECTADO!</p><p>📱 Dispositivo: <b>' + d.device + '</b></p><p>🕐 ' + d.time + '</p><p>' + d.msg + '</p>';
        document.getElementById('btnStatus').style.display = 'block';
        document.getElementById('btnFoto').style.display = 'block';
        localStorage.setItem('eyelive_url', url);
    })
    .catch(e => {
        document.getElementById('result').innerHTML = '❌ Erro ao conectar. Verifique a URL.';
    });
}

function cmd(c){
    if(!BASE_URL) return alert('Conecte primeiro!');
    document.getElementById('result').innerHTML = '⏳ Executando...';
    
    fetch(BASE_URL + '/cmd/' + c)
    .then(r => r.json())
    .then(d => {
        document.getElementById('result').innerHTML = '<p>✅ Comando: <b>' + d.cmd + '</b></p><p>🕐 ' + d.time + '</p><p>' + JSON.stringify(d, null, 2) + '</p>';
    })
    .catch(e => {
        document.getElementById('result').innerHTML = '❌ Erro: ' + e.message;
    });
}

// Carregar URL salva
var saved = localStorage.getItem('eyelive_url');
if(saved){ document.getElementById('url').value = saved; }
</script>
</body>
</html>
