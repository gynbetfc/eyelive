<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:monospace;padding:10px;max-width:500px;margin:0 auto}
        input,button{width:100%;padding:15px;margin:5px 0;background:#111;border:1px solid #333;color:#fff;font-size:16px}
        button{background:#ffd700;color:#000;font-weight:bold;cursor:pointer}
        .green{background:#00ff88;color:#000}
        .red{background:#f44;color:#fff}
        .view{width:100%;height:300px;background:#111;display:flex;align-items:center;justify-content:center;margin:10px 0;border-radius:10px;overflow:hidden}
        .view img{width:100%;height:100%;object-fit:cover}
        audio{width:100%;margin:5px 0}
        .info{color:#888;font-size:.8em;text-align:center}
    </style>
</head>
<body>
    <h1 style="text-align:center;color:#ffd700">EYELIVE</h1>
    <input type="text" id="url" placeholder="URL do Serveo: https://xxx.serveo.net">
    <button onclick="conectar()">🔗 CONECTAR</button>
    <div id="painel" style="display:none">
        <button class="green" onclick="live()">🎥 LIVE (5s)</button>
        <button onclick="foto()">📸 FOTO</button>
        <button onclick="status()">📊 STATUS</button>
    </div>
    <div class="view" id="view">📷</div>
    <audio id="audio" controls style="display:none"></audio>
    <div class="info" id="info"></div>

<script>
var BASE='';
var slideshow=null;

async function conectar(){
    var u=document.getElementById('url').value.trim();
    if(!u.startsWith('http'))u='https://'+u;
    try{
        var r=await fetch(u+'/id');
        var d=await r.json();
        BASE=u;
        document.getElementById('painel').style.display='block';
        document.getElementById('info').textContent='✅ Conectado: '+d.id;
        localStorage.setItem('eyelive_url',u);
    }catch(e){
        alert('Erro ao conectar!');
    }
}

async function live(){
    if(slideshow)clearInterval(slideshow);
    document.getElementById('info').textContent='🎥 Gravando LIVE...';
    document.getElementById('audio').style.display='none';
    
    try{
        var r=await fetch(BASE+'/live');
        var d=await r.json();
        
        if(d.fotos && d.fotos.length>0){
            var i=0;
            document.getElementById('view').innerHTML='<img src="data:image/jpeg;base64,'+d.fotos[0]+'" id="slide">';
            
            slideshow=setInterval(function(){
                i=(i+1)%d.fotos.length;
                document.getElementById('slide').src='data:image/jpeg;base64,'+d.fotos[i];
            },1000);
            
            if(d.audio){
                var audio=document.getElementById('audio');
                audio.src='data:audio/aac;base64,'+d.audio;
                audio.style.display='block';
                audio.play();
            }
            
            document.getElementById('info').textContent='✅ '+d.count+' fotos + áudio';
            setTimeout(function(){clearInterval(slideshow)},5000);
        }
    }catch(e){
        document.getElementById('info').textContent='Erro: '+e.message;
    }
}

async function foto(){
    document.getElementById('info').textContent='📸 Tirando foto...';
    try{
        var r=await fetch(BASE+'/foto');
        var blob=await r.blob();
        var url=URL.createObjectURL(blob);
        document.getElementById('view').innerHTML='<img src="'+url+'">';
        document.getElementById('info').textContent='✅ Foto!';
    }catch(e){
        document.getElementById('info').textContent='Erro';
    }
}

async function status(){
    try{
        var r=await fetch(BASE+'/status');
        var d=await r.json();
        document.getElementById('info').textContent='🔋 '+d.bateria+' | 🕐 '+d.time;
    }catch(e){}
}

var s=localStorage.getItem('eyelive_url');
if(s){document.getElementById('url').value=s;conectar();}
</script>
</body>
</html>
