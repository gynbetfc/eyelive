<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:monospace;padding:10px;max-width:500px;margin:0 auto}
        input,button{width:100%;padding:15px;margin:5px 0;background:#111;border:1px solid #333;color:#fff;font-size:16px}
        button{background:#ffd700;color:#000;font-weight:bold;cursor:pointer}
        .green{background:#00ff88;color:#000}.red{background:#f44;color:#fff}
        .view{width:100%;height:300px;background:#111;display:flex;align-items:center;justify-content:center;margin:10px 0;border-radius:10px;overflow:hidden}
        .view img{width:100%;height:100%;object-fit:cover}
        audio{width:100%;margin:5px 0}
        .info{color:#888;font-size:.8em;text-align:center;margin:5px 0}
        .live-badge{display:inline-block;background:#f44;color:#fff;padding:3px 8px;border-radius:5px;font-size:.7em;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    </style>
</head>
<body>
    <h1 style="text-align:center;color:#ffd700">EYELIVE</h1>
    <input type="text" id="url" placeholder="URL do Serveo: https://xxx.serveo.net">
    <button onclick="conectar()">🔗 CONECTAR</button>
    <div id="painel" style="display:none">
        <button class="red" onclick="startLive()">🔴 LIVE CONTÍNUA</button>
        <button onclick="stopLive()">⏹️ PARAR</button>
        <button onclick="foto()">📸 FOTO</button>
        <button onclick="status()">📊 STATUS</button>
    </div>
    <div class="info" id="info">Desconectado</div>
    <div class="view" id="view">📷</div>
    <audio id="audio" controls style="display:none"></audio>

<script>
var BASE='',liveInterval=null,slideInterval=null;

async function conectar(){
    var u=document.getElementById('url').value.trim();
    if(!u.startsWith('http'))u='https://'+u;
    try{
        var r=await fetch(u+'/id');
        var d=await r.json();
        BASE=u;
        document.getElementById('painel').style.display='block';
        document.getElementById('info').innerHTML='✅ Conectado: '+d.id;
        localStorage.setItem('eyelive_url',u);
    }catch(e){alert('Erro ao conectar!')}
}

async function fetchLive(){
    try{
        var r=await fetch(BASE+'/live');
        var d=await r.json();
        if(d.fotos && d.fotos.length>0){
            var i=0;
            document.getElementById('view').innerHTML='<img src="data:image/jpeg;base64,'+d.fotos[0]+'" id="slide">';
            if(slideInterval)clearInterval(slideInterval);
            slideInterval=setInterval(function(){
                i=(i+1)%d.fotos.length;
                var img=document.getElementById('slide');
                if(img)img.src='data:image/jpeg;base64,'+d.fotos[i];
            },1000);
            if(d.audio){
                var audio=document.getElementById('audio');
                audio.src='data:audio/aac;base64,'+d.audio;
                audio.style.display='block';
                audio.play();
            }
            document.getElementById('info').innerHTML='<span class="live-badge">LIVE</span> '+d.time;
        }
    }catch(e){}
}

function startLive(){
    document.getElementById('info').innerHTML='<span class="live-badge">LIVE</span> Iniciando...';
    fetchLive();
    liveInterval=setInterval(fetchLive, 6000);
}

function stopLive(){
    if(liveInterval)clearInterval(liveInterval);
    if(slideInterval)clearInterval(slideInterval);
    document.getElementById('info').innerHTML='⏹️ Parado';
}

async function foto(){
    try{
        var r=await fetch(BASE+'/foto');
        var blob=await r.blob();
        document.getElementById('view').innerHTML='<img src="'+URL.createObjectURL(blob)+'">';
        document.getElementById('info').textContent='✅ Foto';
    }catch(e){}
}

async function status(){
    try{
        var r=await fetch(BASE+'/status');
        var d=await r.json();
        document.getElementById('info').textContent='🔋 '+d.bateria+' | 🕐 '+d.time;
    }catch(e){}
}

var s=localStorage.getItem('eyelive_url');
if(s){document.getElementById('url').value=s;conectar();}
</script>
</body>
</html>
